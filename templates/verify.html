{% extends 'base.html' %}
{% block title %}Verify OTP{% endblock %}
{% block content %}
    <h2>Verify OTP</h2>
    <p>For {{ email }}</p>
    {% if message %}
        <p class="message">{{ message }}</p>
    {% endif %}
    <form method="POST">
        <input type="text" name="otp" placeholder="Enter OTP" required>
        <button type="submit">Verify</button>
    </form>
    <div class="links">
        <a href="/" class="btn btn-secondary">Back to Login</a>
    </div>
{% endblock %}
